<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="5" fill="#0b0f1a"/>
  <!-- center hub -->
  <circle cx="16" cy="16" r="4.5" fill="#006FFF"/>
  <!-- spokes -->
  <line x1="16" y1="11.5" x2="16" y2="5"  stroke="#006FFF" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="16" y1="20.5" x2="16" y2="27" stroke="#006FFF" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="11.5" y1="16" x2="5"  y2="16" stroke="#006FFF" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="20.5" y1="16" x2="27" y2="16" stroke="#006FFF" stroke-width="1.8" stroke-linecap="round"/>
  <!-- diagonal spokes -->
  <line x1="13.2" y1="13.2" x2="7.5"  y2="7.5"  stroke="#338CFF" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
  <line x1="18.8" y1="13.2" x2="24.5" y2="7.5"  stroke="#338CFF" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
  <line x1="13.2" y1="18.8" x2="7.5"  y2="24.5" stroke="#338CFF" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
  <line x1="18.8" y1="18.8" x2="24.5" y2="24.5" stroke="#338CFF" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
  <!-- outer nodes -->
  <circle cx="16"  cy="4"   r="2.5" fill="#338CFF"/>
  <circle cx="16"  cy="28"  r="2.5" fill="#338CFF"/>
  <circle cx="4"   cy="16"  r="2.5" fill="#338CFF"/>
  <circle cx="28"  cy="16"  r="2.5" fill="#338CFF"/>
  <!-- diagonal nodes -->
  <circle cx="7"  cy="7"   r="1.8" fill="#338CFF" opacity="0.7"/>
  <circle cx="25" cy="7"   r="1.8" fill="#338CFF" opacity="0.7"/>
  <circle cx="7"  cy="25"  r="1.8" fill="#338CFF" opacity="0.7"/>
  <circle cx="25" cy="25"  r="1.8" fill="#338CFF" opacity="0.7"/>
</svg>
